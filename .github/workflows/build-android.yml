name: Build Android APK

on:
  push:
    branches:
      - main-zh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Set tag name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "GIT_TAG_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi
          echo $GIT_TAG_NAME
      - name: Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Pack APKs
        run: |
          mkdir -p artifacts
          find src/android/app/build -type f -name "*.apk" -exec cp {} artifacts/ \;
          APK_FILE=$(find artifacts -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" artifacts/AzaharPlus-zh.apk
          fi
          ls -la artifacts/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azahar-android-apk
          path: artifacts/*.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main-zh'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2126-zh
          name: "AzaharPlus-zh 掌機繁體中文共存版"
          body: |
            ### 🎮 AzaharPlus-zh 掌機繁體中文共存版

            - **掌機獨立包名**：`io.github.lime3ds.android.zh`（可與官方原版並存安裝，互不干擾衝突）
            - **完整在地化**：100% 台灣繁體中文前端介面與選單主題陣列支援
            - **原生語系架構**：相容 Android 13+ 原生多語系熱切換
          files: artifacts/AzaharPlus-zh.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
